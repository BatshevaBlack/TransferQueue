# Configuration of backend_comparison.py (see README_BACKEND_COMPARISON.md).

benchmark:
  # Ray cluster to connect to; the cluster is started outside this script.
  ray_address: auto

  # Number of writers; the same number of readers is created (each reader reads one writer).
  clients: 1
  reader_mapping: paired      # paired: reader i reads writer i | shuffled: seeded one-to-one permutation
  shuffle_seed: 42            # makes the shuffled assignment repeatable; ignored for paired

  # Device of the writers' payloads and of the readers' results; one pair per run.
  # If a backend does not deliver on reader_device, a copy is added inside the timed GET.
  writer_device: cpu          # cpu | cuda
  reader_device: cpu          # cpu | cuda

  sizes:
    start_kib: 128
    count: 14                 # doubling: 128 KiB through 1 GiB

  # Operations per writer = max(1, min(ops_per_iteration, floor(max_iteration_gib / payload size))).
  # Every operation uses its own key; the same keys are reused by every iteration.
  ops_per_iteration: 100
  max_iteration_gib: 2
  warmup_iterations: 3
  measured_iterations: 10

  placement:
    # null splits the alive Ray nodes in half: first half writers, second half readers.
    writer_nodes: null
    reader_nodes: null
    max_clients_per_node: 1

  # Per case: label and a normal TransferQueue config.
  # The config is merged over the library defaults. SimpleStorage total_storage_size
  # (a sample count, not bytes) is calculated as 1.25 x clients x largest ops per iteration.
  backends:
    - label: simple_tcp
      tq_config:
        metrics:
          enabled: false
        backend:
          storage_backend: SimpleStorage
          SimpleStorage:
            num_data_storage_units: 2
            required_node_resource: "node:${benchmark.placement.writer_nodes.0}"

    - label: mooncake_tcp
      tq_config:
        metrics:
          enabled: false
        backend:
          storage_backend: MooncakeStore
          MooncakeStore:
            auto_init: true
            # The master starts on the first writer node and must be reachable from every client node.
            metadata_server: "${benchmark.placement.writer_nodes.0}:50050"
            master_server_address: "${benchmark.placement.writer_nodes.0}:50051"
            protocol: tcp
            use_gdr: false
            global_segment_size: 4294967296   # bytes mounted per client
            local_buffer_size: 2147483648     # bytes per client; must hold the largest payload

    - label: mooncake_rdma
      tq_config:
        backend:
          storage_backend: MooncakeStore
          MooncakeStore:
            auto_init: true
            metadata_server: "${benchmark.placement.writer_nodes.0}:50050"
            master_server_address: "${benchmark.placement.writer_nodes.0}:50051"
            protocol: rdma
            use_gdr: false
            global_segment_size: 4294967296
            local_buffer_size: 2147483648


    # TEMPORARY note, remove or update once the pool / no-pool setup is settled:
    # ray_nixl needs a Ray with NIXL tensor transport (the runs so far used the patched Ray RDT image).
    # The benchmark sets TQ_RDT_RECV_DEVICE (= reader_device) in every client; only the patched receive path
    # reads it. Without that patch the result lands where Ray decides and get_device_warning is set.
    # A NIXL memory pool (backend.RayStore.rdt_pool_bytes / rdt_pool_device) is read only by an overlay
    # RayStorageClient, not by this repo's client, so this case is the no-pool variant. On the patched Ray
    # the no-pool run only worked with an overlay client that keeps the writer's ObjectRefs alive.
    - label: ray_nixl
      tq_config:
        metrics:
          enabled: false
        backend:
          storage_backend: RayStore

    # TODO: add these cases once each has run successfully (they are untested here).
    # Yuanrong (host and RDMA transports) is not implemented in this benchmark yet.

    # mooncake_gdr runs only with writer_device and reader_device set to cuda on RDMA nodes with CUDA;
    # with any other pair the setup check fails because the GDR path is not active on every client.
    - label: mooncake_gdr
      tq_config:
        backend:
          storage_backend: MooncakeStore
          MooncakeStore:
            auto_init: true
            metadata_server: "${benchmark.placement.writer_nodes.0}:50050"
            master_server_address: "${benchmark.placement.writer_nodes.0}:50051"
            protocol: rdma
            use_gdr: true
            gdr_staging_buffer_mb: 2048   # must hold the largest payload, else it is split into chunks
            global_segment_size: 4294967296
            local_buffer_size: 2147483648
