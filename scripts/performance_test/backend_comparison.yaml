# Configuration of backend_comparison.py (see README_BACKEND_COMPARISON.md).

benchmark:
  # Ray cluster to connect to; the cluster is started outside this script.
  ray_address: auto

  # Number of writers; the same number of readers is created (each reader reads one writer).
  clients: 1
  reader_mapping: paired      # paired: reader i reads writer i | shuffled: seeded one-to-one permutation
  shuffle_seed: 42            # makes the shuffled assignment repeatable; ignored for paired

  sizes:
    start_kib: 128
    count: 14                 # doubling: 128 KiB through 1 GiB

  # Operations per writer = max(1, min(ops_per_iteration, floor(max_iteration_gib / payload size))).
  # Every operation uses its own key; the same keys are reused by every iteration.
  ops_per_iteration: 100
  max_iteration_gib: 2
  warmup_iterations: 3
  measured_iterations: 10

  placement:
    # null splits the alive Ray nodes in half: first half writers, second half readers.
    writer_nodes: null
    reader_nodes: null
    max_clients_per_node: 1

  # Per case: label, payload device (cpu | cuda) and a normal TransferQueue config.
  # The config is merged over the library defaults. SimpleStorage total_storage_size
  # (a sample count, not bytes) is calculated as 1.25 x clients x largest ops per iteration.
  backends:
    - label: simple_tcp
      device: cpu
      tq_config:
        metrics:
          enabled: false
        backend:
          storage_backend: SimpleStorage
          SimpleStorage:
            num_data_storage_units: 2
            required_node_resource: "node:${benchmark.placement.writer_nodes.0}"

    - label: mooncake_tcp
      device: cpu
      tq_config:
        metrics:
          enabled: false
        backend:
          storage_backend: MooncakeStore
          MooncakeStore:
            auto_init: true
            # The master starts on the first writer node and must be reachable from every client node.
            metadata_server: "${benchmark.placement.writer_nodes.0}:50050"
            master_server_address: "${benchmark.placement.writer_nodes.0}:50051"
            protocol: tcp
            use_gdr: false
            global_segment_size: 4294967296   # bytes mounted per client
            local_buffer_size: 2147483648     # bytes per client; must hold the largest payload

    - label: mooncake_rdma
      device: cpu
      tq_config:
        backend:
          storage_backend: MooncakeStore
          MooncakeStore:
            auto_init: true
            metadata_server: "${benchmark.placement.writer_nodes.0}:50050"
            master_server_address: "${benchmark.placement.writer_nodes.0}:50051"
            protocol: rdma
            use_gdr: false
            global_segment_size: 4294967296
            local_buffer_size: 2147483648


